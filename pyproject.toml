[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-prep"
version = "1.0.0"
description = "CLI for a personal interview-prep repo: timer, spaced repetition, dashboard."
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
prep = "prepkit.cli:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
packages = ["prepkit"]
